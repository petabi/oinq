[package]
name = "oinq"
version = "0.14.0"
edition = "2024"
rust-version = "1.85"
description = "The inter-agent communication protocol in the REview ecosystem"
readme = "README.md"
homepage = "https://github.com/petabi/oinq"
repository = "https://github.com/petabi/oinq"
license = "Apache-2.0"

[dependencies]
bincode = { version = "2", features = ["serde"] }
futures = "0.3"
num_enum = "0.7"
quinn = { version = "0.11", default-features = false, features = [
    "runtime-tokio",
    "rustls-aws-lc-rs",
] }
quinn-proto = { version = "0.11", default-features = false, features = ["rustls-aws-lc-rs"] }
rustls = { version = "0.23", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["io-util"] }

[dev-dependencies]
futures = "0.3"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs"] }
rustls = { version = "0.23", default-features = false, features = [
    "aws_lc_rs",
    "prefer-post-quantum",
    "std",
] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[lints.clippy]
pedantic = "warn"
unwrap_used = "warn"
