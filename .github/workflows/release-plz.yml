name: Release-plz

# Assumes a push to main has already run CI. Release that commit only when
# the run succeeded and the commit is still the tip of main. A failed run
# fails this workflow. A manual dispatch calls CI first.
#
# Release PRs are opened with the petabi-release GitHub App, so their CI, PR
# title, and changelog workflows run automatically. The app token is scoped to
# this repository and is used only by release-pr; the release job keeps
# GITHUB_TOKEN. check-release-pr remains an extra validation of the branch.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.sha }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  blocked:
    name: CI failed
    if: >-
      ${{ github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'failure' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Stop before release
        env:
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_URL: ${{ github.event.workflow_run.html_url }}
        shell: bash
        run: |
          set -eu
          echo "CI failed for $CI_SHA ($CI_URL). Release-plz will not run."
          exit 1

  release:
    needs: check
    if: >-
      ${{ always() && !cancelled() && (
        (github.event_name == 'workflow_dispatch' && needs.check.result == 'success') ||
        (github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.head_sha == github.sha)
      ) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-plz
          save-if: false
      - uses: release-plz/action@476794ede164c5137bfc3a1dc6ed3675275690f9 # v0.5.99
        with:
          command: release
          version: 0.4.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # `check` is skipped on workflow_run; without always(), success() sees that
  # skipped ancestor and skips this job even when release succeeded.
  release-pr:
    needs: release
    if: ${{ always() && !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pr: ${{ steps.release-plz.outputs.pr }}
      prs_created: ${{ steps.release-plz.outputs.prs_created }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-plz
          save-if: false
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: release-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - uses: release-plz/action@476794ede164c5137bfc3a1dc6ed3675275690f9 # v0.5.99
        id: release-plz
        with:
          command: release-pr
          version: 0.4.3
        env:
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token }}

  check-release-pr:
    needs: release-pr
    if: >-
      ${{ always() && !cancelled() &&
          needs.release-pr.result == 'success' &&
          needs.release-pr.outputs.prs_created == 'true' }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      ref: ${{ fromJSON(needs.release-pr.outputs.pr).head_branch }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
