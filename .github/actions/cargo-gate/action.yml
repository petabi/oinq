name: Cargo gate
description: Decide whether this CI run should execute the Rust checks.

inputs:
  call-ref:
    description: Non-empty when this workflow was invoked via workflow_call
    required: false
    default: ""

outputs:
  cargo:
    description: true when the Rust checks should run
    value: ${{ steps.gate.outputs.cargo }}

runs:
  using: composite
  steps:
    - name: Decide whether to run the Rust checks
      id: gate
      shell: bash
      env:
        CALL_REF: ${{ inputs.call-ref }}
        EVENT: ${{ github.event_name }}
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PR_HEAD: ${{ github.event.pull_request.head.sha }}
        BEFORE: ${{ github.event.before }}
        SHA: ${{ github.sha }}
      run: bash .github/scripts/skip-build.sh
